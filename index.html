<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: black;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 340px;
    }
    input, select {
      width: 300px;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .error {
      color: red;
      font-size: 0.9em;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0.6;
    }
    button.enabled {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registration Form</h2>
    <form id="regForm">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name">
      <div id="nameError" class="error"></div>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email">
      <div id="emailError" class="error"></div>

      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter your password">
      <div id="passwordError" class="error"></div>

      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <div id="genderError" class="error"></div>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob">
      <div id="dobError" class="error"></div>

      <button type="submit" id="submitBtn" disabled>Register</button>
    </form>
  </div>

  <script>
    const nameInput = document.getElementById("name")
    const emailInput = document.getElementById("email")
    const passwordInput = document.getElementById("password")
    const genderInput = document.getElementById("gender")
    const dobInput = document.getElementById("dob")
    const submitBtn = document.getElementById("submitBtn")

    const nameError = document.getElementById("nameError")
    const emailError = document.getElementById("emailError")
    const passwordError = document.getElementById("passwordError")
    const genderError = document.getElementById("genderError")
    const dobError = document.getElementById("dobError")

    const form = document.getElementById("regForm")

    function validateName() {
      if (nameInput.value.trim() === "") {
        nameError.textContent = "Name cannot be empty."
        return false;
      } else {
        nameError.textContent = ""
        return true;
      }
    }

    function validateEmail() {
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/
      if (!emailPattern.test(emailInput.value.trim())) {
        emailError.textContent = "Enter a valid email address."
        return false
      } else {
        emailError.textContent = ""
        return true
      }
    }

    function validatePassword() {
      if (passwordInput.value.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters."
        return false
      } else {
        passwordError.textContent = ""
        return true
      }
    }

    function validateGender() {
      if (genderInput.value === "") {
        genderError.textContent = "Please select your gender."
        return false
      } else {
        genderError.textContent = ""
        return true
      }
    }

    function validateDOB() {
      if (dobInput.value === "") {
        dobError.textContent = "Please select your date of birth."
        return false
      } else {
        dobError.textContent = ""
        return true
      }
    }

    function checkAllValid() {
      const validName = validateName()
      const validEmail = validateEmail()
      const validPassword = validatePassword()
      const validGender = validateGender()
      const validDOB = validateDOB()

      if (validName && validEmail && validPassword && validGender && validDOB) {
        submitBtn.disabled = false
        submitBtn.classList.add("enabled")
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.remove("enabled")
      }
    }
    nameInput.addEventListener("input", checkAllValid)
    emailInput.addEventListener("input", checkAllValid)
    passwordInput.addEventListener("input", checkAllValid)
    genderInput.addEventListener("change", checkAllValid)
    dobInput.addEventListener("change", checkAllValid)

    form.addEventListener("submit", function(e) {
      e.preventDefault()
      alert("Registration successful!")
    })
  </script>
</body>
</html>
